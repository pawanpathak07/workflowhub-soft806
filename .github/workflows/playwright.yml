name: Playwright E2E Tests

on:
  push:
    branches: [main, feature/remaining-work]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workflowhub
          POSTGRES_USER: workflowhub
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflowhub -d workflowhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: github-actions-test-only-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOW_INSECURE_KEY: "True"
      POSTGRES_DB: workflowhub
      POSTGRES_USER: workflowhub
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      AUTH_THROTTLE_RATE: 1000/min
      VITE_API_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Start Django backend
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &

      - name: Wait for Django backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health/; then
              echo "Django backend is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Django backend did not start."
          cat /tmp/django.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e -- --workers=1

      - name: Upload Playwright reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
