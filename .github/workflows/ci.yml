name: CI

# Runs on every push and on every pull request into main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # Non-secret configuration shared by the jobs below
  VITE_API_URL: http://localhost:8000/api
  DJANGO_DEBUG: "True"
  AUTH_THROTTLE_RATE: 1000/min

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies with pip
        run: pip install -r requirements.txt
      - name: Check that migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test

  frontend:
    name: Frontend tests and build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies with npm
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: workflowhub-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: workflowhub-frontend:ci
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the backend container
        run: |
          docker run -d --name api -p 8000:8000 -e DJANGO_SECRET_KEY=${{ github.run_id }}-ci-only-key workflowhub-backend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/health/ && exit 0
            sleep 2
          done
          docker logs api
          exit 1
