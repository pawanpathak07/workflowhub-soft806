name: CI

# Runs on every push and on every pull request into main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  # Non-secret configuration shared by the jobs below
  VITE_API_URL: http://localhost:8000/api
  DJANGO_DEBUG: "True"
  AUTH_THROTTLE_RATE: 1000/min

jobs:
  
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workflowhub
          POSTGRES_USER: workflowhub
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflowhub -d workflowhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: github-actions-test-only-key
      POSTGRES_DB: workflowhub
      POSTGRES_USER: workflowhub
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --verbosity 2


  frontend:
    name: Frontend tests and build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies with npm
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build


  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: workflowhub-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: workflowhub-frontend:ci
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Smoke test the backend container
        run: |
          docker network create workflowhub-ci

          docker run -d \
            --name postgres-ci \
            --network workflowhub-ci \
            -e POSTGRES_DB=workflowhub \
            -e POSTGRES_USER=workflowhub \
            -e POSTGRES_PASSWORD=ci-test-password \
            postgres:16

          for i in $(seq 1 30); do
            if docker exec postgres-ci pg_isready \
              -U workflowhub -d workflowhub; then
              break
            fi
            sleep 2
          done

          docker exec postgres-ci pg_isready \
            -U workflowhub -d workflowhub

          docker run -d \
            --name api \
            --network workflowhub-ci \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-test-key \
            -e POSTGRES_DB=workflowhub \
            -e POSTGRES_USER=workflowhub \
            -e POSTGRES_PASSWORD=ci-test-password \
            -e POSTGRES_HOST=postgres-ci \
            -e POSTGRES_PORT=5432 \
            workflowhub-backend:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health/; then
              echo "Backend smoke test passed"
              exit 0
            fi
            sleep 2
          done

          docker logs api
          docker logs postgres-ci
          exit 1

