
version: 2.1

jobs:
  backend-test:
    docker:
      - image: cimg/python:3.12
        environment:
          DJANGO_SECRET_KEY: circleci-test-only-key
          POSTGRES_DB: workflowhub
          POSTGRES_USER: workflowhub
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"

      - image: cimg/postgres:16.4
        environment:
          POSTGRES_DB: workflowhub
          POSTGRES_USER: workflowhub
          POSTGRES_PASSWORD: ci-test-password

    working_directory: ~/workflowhub

    steps:
      - checkout

      - run:
          name: Install backend dependencies
          command: |
            cd backend
            python -m pip install -r requirements.txt

      
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if python -c "
            import socket
            socket.create_connection(('localhost', 5432), 2).close()
            "; then
                echo "PostgreSQL port is reachable"
                exit 0
              fi
              sleep 2
            done

            echo "PostgreSQL did not become reachable"
            exit 1

      - run:
          name: Check Django migrations
          command: |
            mkdir -p test-results/backend
            set -o pipefail
            cd backend
            python manage.py makemigrations --check --dry-run \
              2>&1 | tee ../test-results/backend/migrations.log

      - run:
          name: Run Django backend tests
          command: |
            mkdir -p test-results/backend
            set -o pipefail
            cd backend
            python manage.py test --verbosity 2 \
              2>&1 | tee ../test-results/backend/tests.log

      - store_artifacts:
          path: test-results/backend
          destination: backend-results

  frontend-test:
    docker:
      - image: cimg/node:20.19

    working_directory: ~/workflowhub

    steps:
      - checkout

      - run:
          name: Install frontend dependencies
          command: |
            cd frontend
            npm ci

      - run:
          name: Run frontend tests
          command: |
            mkdir -p test-results/frontend
            set -o pipefail
            cd frontend
            npm test \
              2>&1 | tee ../test-results/frontend/tests.log

      - run:
          name: Build React frontend
          command: |
            mkdir -p test-results/frontend
            set -o pipefail
            cd frontend
            npm run build \
              2>&1 | tee ../test-results/frontend/build.log

      - store_artifacts:
          path: test-results/frontend
          destination: frontend-results

  docker-build:
    docker:
      - image: cimg/base:stable

    working_directory: ~/workflowhub

    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Build backend Docker image
          command: |
            mkdir -p docker-results
            set -o pipefail
            docker build -t workflowhub-backend:ci ./backend \
              2>&1 | tee docker-results/backend-build.log

      - run:
          name: Build frontend Docker image
          command: |
            set -o pipefail
            docker build \
              --build-arg VITE_API_URL=http://localhost:8000/api \
              -t workflowhub-frontend:ci ./frontend \
              2>&1 | tee docker-results/frontend-build.log

      - store_artifacts:
          path: docker-results
          destination: docker-results

workflows:
  workflowhub-ci:
    jobs:
      - backend-test
      - frontend-test
      - docker-build:
          requires:
            - backend-test
            - frontend-test
