
version: 2.1

jobs:
  backend-test:
    docker:
      - image: cimg/python:3.13
    working_directory: ~/workflowhub
    environment:
      DJANGO_SECRET_KEY: "circleci-test-only-key-not-for-production"
    steps:
      - checkout
      - run:
          name: Install backend dependencies
          command: |
            cd backend
            python -m pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run Django backend tests
          command: |
            cd backend
            python manage.py test

  frontend-test:
    docker:
      - image: cimg/node:20.19
    working_directory: ~/workflowhub
    steps:
      - checkout
      - run:
          name: Install frontend dependencies
          command: |
            cd frontend
            npm ci
      - run:
          name: Run frontend tests
          command: |
            cd frontend
            npm test -- --run

workflows:
  workflowhub-ci:
    jobs:
      - backend-test
      - frontend-test
